name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:coverage
      - run: npm run check:quality

  migration-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_DB: devgod
          POSTGRES_USER: devgod
          POSTGRES_PASSWORD: devgod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devgod -d devgod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEVGOD_CORE_DATABASE_URL: postgresql://devgod:devgod@127.0.0.1:5432/devgod
      DEVGOD_WORKSPACE_SLUG: ci
      DEVGOD_WORKSPACE_NAME: CI Workspace
      DEVGOD_PROJECT_SLUG: devgod-ci
      DEVGOD_PROJECT_NAME: devgod-ci
      DEVGOD_PROJECT_REPO_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:migrations:live

  windows-setup-smoke:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/setup-powershell-smoke.test.ts
