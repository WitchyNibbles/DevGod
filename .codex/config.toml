model = "gpt-5.4"
model_reasoning_effort = "high"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "danger-full-access"
project_doc_fallback_filenames = [".agents.md", "AGENTS.md"]
project_doc_max_bytes = 32768

[features]
multi_agent = true
personality = true
enable_request_compression = true
goals = true
plugin_hooks = true

[agents]
max_threads = 8
max_depth = 2

# devgod keeps reviewed project memory in repo markdown and operational state in
# the shared core service backed by Postgres + pgvector.
#
# Expected environment for the shared core admin/runtime surface:
# - DEVGOD_CORE_DATABASE_URL
# - DEVGOD_WORKSPACE_SLUG
# - DEVGOD_PROJECT_SLUG
