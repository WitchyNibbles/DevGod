model = "gpt-5.4"
model_reasoning_effort = "medium"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "danger-full-access"
project_doc_fallback_filenames = [".agents.md", "AGENTS.md"]
project_doc_max_bytes = 8192

[features]
multi_agent = true
personality = true
enable_request_compression = true
goals = true
plugin_hooks = true

[agents]
max_threads = 8
max_depth = 2

[mcp_servers.graphify]
command = "uv"
args = ["tool", "run", "--from", "graphifyy", "python", "-m", "graphify.serve", "graphify-out/graph.json"]

[mcp_servers.playwright]
command = "npx"
args = ["--yes", "@playwright/mcp@latest", "--config", ".devgod/playwright/mcp.json"]

[mcp_servers.playwright_vision]
command = "npx"
args = ["--yes", "@playwright/mcp@latest", "--config", ".devgod/playwright/mcp.vision.json"]

# devgod keeps reviewed project memory in repo markdown and operational state in
# the shared core service backed by Postgres + pgvector.
#
# Expected environment for the shared core admin/runtime surface:
# - DEVGOD_CORE_DATABASE_URL
# - DEVGOD_WORKSPACE_SLUG
# - DEVGOD_PROJECT_SLUG
